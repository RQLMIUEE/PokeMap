plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// 🔐 Carrega a chave de API de forma segura a partir do .env ou local.properties
// (arquivos que devem ficar fora do Git)
Properties properties = new Properties()

File localProps = project.rootProject.file('local.properties')
if (localProps.exists()) {
    properties.load(localProps.newDataInputStream())
}

File envFile = project.rootProject.file('.env')
if (envFile.exists()) {
    properties.load(envFile.newDataInputStream())
}

String mapsApiKey = properties.getProperty(
        'MAPS_API_KEY',
        'CHAVE_NAO_CONFIGURADA'
)

android {
    namespace 'br.com.curso.pokemap'
    compileSdk 34

    defaultConfig {
        applicationId "br.com.curso.pokemap"
        minSdk 24
        targetSdk 34

        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        vectorDrawables {
            useSupportLibrary true
        }

        // Injeta a chave no AndroidManifest.xml
        manifestPlaceholders = [
                MAPS_API_KEY: mapsApiKey
        ]

        // Disponibiliza a chave através do BuildConfig
        buildConfigField "String", "MAPS_API_KEY", "\"${mapsApiKey}\""
    }

    buildTypes {
        release {
            minifyEnabled false

            proguardFiles(
                    getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            )
        }
    }

    // ☕ Java 17
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 🟣 Kotlin JVM 17
    kotlinOptions {
        jvmTarget = '17'
    }

    // 🎨 Jetpack Compose
    buildFeatures {
        compose true
        buildConfig true
    }

    // ⚠️ IMPORTANTE:
    // Não usamos mais:
    //
    // composeOptions {
    //     kotlinCompilerExtensionVersion "1.5.8"
    // }
    //
    // O Compose Compiler agora é gerenciado pelo plugin:
    // org.jetbrains.kotlin.plugin.compose

    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {

    // 🎨 Jetpack Compose BOM
    implementation platform('androidx.compose:compose-bom:2024.02.00')

    // Compose
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'

    // Android + Compose
    implementation 'androidx.activity:activity-compose:1.8.2'

    // AndroidX
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'

    // 🗺️ Google Maps + Compose
    implementation 'com.google.maps.android:maps-compose:4.3.3'
    implementation 'com.google.android.gms:play-services-maps:18.2.0'
    implementation 'com.google.android.gms:play-services-location:21.1.0'

    // 🧪 Testes
    testImplementation 'junit:junit:4.13.2'

    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    androidTestImplementation platform(
            'androidx.compose:compose-bom:2024.02.00'
    )

    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'

    // 🔧 Debug
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}





